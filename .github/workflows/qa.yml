name: QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: qa-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Install ffmpeg for video capture
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Droid CLI
        run: curl -fsSL https://app.factory.ai/cli | sh

      - name: Run QA skill
        id: qa
        continue-on-error: true
        timeout-minutes: 20
        env:
          CI: "true"
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          QA_EVIDENCE_TOKEN: ${{ secrets.QA_EVIDENCE_TOKEN }}
          REPO_ID: ${{ github.event.repository.id }}
        run: |
          mkdir -p qa-results
          droid exec --auto high "You are running in a non-interactive CI environment. There is NO human available. Do NOT use AskUser, do NOT wait for confirmations, do NOT pause for input. Run the qa skill. Record and upload video evidence per the qa skill's Evidence Capture rules. Write the final report to qa-results/report.md." 2>&1 | tee qa-output.txt
          exit ${PIPESTATUS[0]}

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-results-${{ github.run_id }}
          path: |
            qa-results/
            qa-output.txt
          retention-days: 14

      - name: Post QA report as PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- qa-report -->';
            const reportPath = 'qa-results/report.md';
            const outputPath = 'qa-output.txt';
            let body = '';

            if (fs.existsSync(reportPath)) {
              body = fs.readFileSync(reportPath, 'utf8');
            } else {
              const raw = fs.existsSync(outputPath) ? fs.readFileSync(outputPath, 'utf8') : 'qa-output.txt missing';
              body = `## QA Report\n\n:no_entry: QA run produced no structured report. See raw output below.\n\n<details><summary>Raw QA output</summary>\n\n\`\`\`text\n${raw}\n\`\`\`\n\n</details>`;
            }

            if (!body.startsWith('## QA Report')) {
              body = `## QA Report\n\n${body}`;
            }

            const footer = `\n\n---\n\n[Artifacts](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) · [Workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            const finalBody = `${marker}\n${body}${footer}`;
            const issue_number = context.payload.pull_request.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: finalBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body: finalBody,
              });
            }

      - name: Propagate QA failure
        if: steps.qa.outcome == 'failure'
        run: exit 1
